name: Software verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native-and-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: DOTNET=dotnet bash scripts/build_software.sh && npm --prefix frontend audit --audit-level=moderate
      - run: pip install -r backend/requirements.txt httpx playwright && python -m playwright install --with-deps chromium
      - run: DOTNET=dotnet AETHER_EVIDENCE_DIR=verification/final AETHER_TEST_PRIVATE=.acceptance-private/native AETHER_SERVER_DLL=.runtime/AetherGrid.Server.dll python scripts/run_v4_checks.py
      - run: DOTNET=dotnet python scripts/verify_ui_journey.py
      - run: python scripts/run_tests.py && dotnet run --project dotnet/AetherGrid.Parity -- verification/v2/parity_fixtures.json
      - run: AETHER_EVIDENCE_DIR=verification/final PYTHONPATH=backend python scripts/offline_readiness_v4.py
      - run: docker build -f deployment/Dockerfile -t aethergrid:ci .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'aethergrid:ci'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: software-verification
          path: verification/final/
