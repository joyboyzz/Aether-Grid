name: Software verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native-and-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      AETHER_EVIDENCE_DIR: .ci-evidence
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: DOTNET=dotnet bash scripts/build_software.sh && npm --prefix frontend audit --audit-level=moderate
      - name: Install Python test dependencies
        timeout-minutes: 8
        run: python -m pip install --disable-pip-version-check --prefer-binary -r backend/requirements.txt playwright
      # Hosted Ubuntu 24.04 supplies the Chromium shared libraries. Avoid an
      # unrelated OS upgrade through the slow Azure APT mirror on every run.
      - name: Install headless Chromium
        timeout-minutes: 8
        run: python -m playwright install --only-shell chromium
      - name: Record fresh CI provenance
        run: |
          mkdir -p .ci-evidence
          python - <<'PYCI'
          import json, os, pathlib
          pathlib.Path('.ci-evidence/provenance.json').write_text(json.dumps({
              'run_id': os.environ['GITHUB_RUN_ID'],
              'source_commit': os.environ['GITHUB_SHA'],
              'reports': 'Only files generated in this CI run; historical local evidence remains in verification/final.',
              'result': 'See the GitHub job conclusion; provenance alone is not a passing result.'
          }, indent=2))
          PYCI
      - run: DOTNET=dotnet AETHER_TEST_PRIVATE=.acceptance-private/native AETHER_SERVER_DLL=.runtime/AetherGrid.Server.dll python scripts/run_v4_checks.py
      - run: DOTNET=dotnet python scripts/verify_ui_journey.py
      - run: python scripts/run_tests.py && dotnet run --project dotnet/AetherGrid.Parity -- verification/v2/parity_fixtures.json
      - run: PYTHONPATH=backend python scripts/offline_readiness_v4.py
      - run: docker build -f deployment/Dockerfile -t aethergrid:ci .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'aethergrid:ci'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: software-verification-${{ github.run_id }}
          path: .ci-evidence/
